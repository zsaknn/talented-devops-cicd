name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]          # Semantic Versioning tag'leri (v1.0.0, v1.1.0 ...)
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---------------- AŞAMA 1: Kod kalitesi ----------------
  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt
      - name: Flake8
        run: flake8 app tests
      - name: Pylint
        run: pylint app --fail-under=8.0

  # ---------------- AŞAMA 2: Birim testleri ----------------
  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt
      - name: Pytest + coverage
        run: pytest -v --cov=app --cov-report=term-missing

  # ---------------- AŞAMA 3: Docker build & push ----------------
  build-and-push:
    name: Build & Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write           # GHCR'ye push için gerekli
    steps:
      - uses: actions/checkout@v4

      - name: Gizli değişken (secret) doğrulaması
        env:
          APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY }}
        run: |
          if [ -z "$APP_SECRET_KEY" ]; then
            echo "::warning::APP_SECRET_KEY tanımlı değil"
          else
            echo "APP_SECRET_KEY mevcut (uzunluk: ${#APP_SECRET_KEY}) - değer loglarda maskelenir"
            echo "Maskeleme testi: $APP_SECRET_KEY"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: GHCR'ye giriş
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: İmaj etiketlerini üret (SemVer)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
